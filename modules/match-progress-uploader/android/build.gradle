plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.matchprogressuploader'
version = '0.1.0'

android {
  namespace "expo.modules.matchprogressuploader"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // FusedLocationProviderClient for the native distance accumulator's GPS consumer. The service
  // falls back to the platform LocationManager GPS_PROVIDER (no extra dep) when Play Services is
  // unavailable, so this is the happy-path provider only — kept minimal, no version pin so it
  // resolves against the app's existing Play Services BOM via Expo autolinking.
  implementation 'com.google.android.gms:play-services-location:21.3.0'
}
