services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runnigapp-backend
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8081
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-*}
      BACKEND_ADMIN_TOKEN: ${BACKEND_ADMIN_TOKEN:-}
      BACKEND_ENABLE_ADMIN_STATUS: ${BACKEND_ENABLE_ADMIN_STATUS:-true}
      BACKEND_ENABLE_RESET_ENDPOINT: ${BACKEND_ENABLE_RESET_ENDPOINT:-false}
      BACKEND_STORE_FILE: /app/data/store.json
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
