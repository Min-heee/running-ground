services:
  postgres:
    image: postgres:16-alpine
    container_name: runnigapp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-runnigapp_preview}
      POSTGRES_USER: ${POSTGRES_USER:-runnigapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runnigapp-preview-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
