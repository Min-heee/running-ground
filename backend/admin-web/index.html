<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>러닝그라운드 관리자</title>
<style>
  :root {
    --bg: #0D101C; --surface: #151A2C; --surface2: #1D2338; --border: #2A3150;
    --text: #F2F4FF; --text2: #9BA3C7; --brand: #6D5EF7; --brand-soft: rgba(109,94,247,0.18);
    --green: #3DDC84; --red: #FF6B6B; --amber: #FFC24B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select, textarea { font-family: inherit; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px 12px; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }

  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; width: 360px; display: flex; flex-direction: column; gap: 14px; }
  .login-card h1 { font-size: 20px; }
  .login-card p { color: var(--text2); font-size: 13px; line-height: 1.5; }

  header.topbar { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
  .brand-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); }
  .topbar h1 { font-size: 16px; }
  .topbar .env { color: var(--text2); font-size: 12px; }
  .topbar .spacer { flex: 1; }

  nav.tabs { display: flex; gap: 6px; padding: 12px 24px 0; flex-wrap: wrap; }
  .tab { background: transparent; color: var(--text2); padding: 9px 16px; border-radius: 10px 10px 0 0; font-size: 14px; font-weight: 700; }
  .tab.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-bottom-color: var(--surface); }

  main { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 0 14px 14px 14px; padding: 20px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat .label { color: var(--text2); font-size: 12px; margin-bottom: 6px; }
  .stat .value { font-size: 26px; font-weight: 800; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text2); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid rgba(42,49,80,0.5); vertical-align: top; }
  .table-scroll { overflow-x: auto; }

  .btn { border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn.good { background: transparent; border-color: var(--green); color: var(--green); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
  .chip.requested { background: rgba(255,194,75,0.15); color: var(--amber); }
  .chip.fulfilled { background: rgba(61,220,132,0.15); color: var(--green); }
  .chip.cancelled { background: rgba(255,107,107,0.15); color: var(--red); }
  .chip.on { background: rgba(61,220,132,0.15); color: var(--green); }
  .chip.off { background: rgba(155,163,199,0.15); color: var(--text2); }

  .section-title { font-size: 15px; font-weight: 800; margin: 22px 0 10px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .form-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text2); }
  .form-wide { grid-column: 1 / -1; }
  .muted { color: var(--text2); font-size: 12px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--brand); color: var(--text); padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 700; display: none; z-index: 20; }
  .toast.error { border-color: var(--red); }
  .empty { color: var(--text2); padding: 24px 0; text-align: center; }
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <form class="login-card" onsubmit="return doLogin(event)">
    <h1>🏃 러닝그라운드 관리자</h1>
    <p>드롭릿 <code>.env.production</code>의 <b>BACKEND_ADMIN_TOKEN</b> 값을 입력하세요. 이 브라우저에만 저장됩니다.</p>
    <input id="tokenInput" type="password" placeholder="관리자 토큰" autocomplete="off">
    <button class="btn primary" type="submit">접속하기</button>
    <p id="loginError" style="color: var(--red); display: none;">토큰이 올바르지 않아요.</p>
  </form>
</div>

<div id="app" style="display: none;">
  <header class="topbar">
    <div class="brand-dot"></div>
    <h1>러닝그라운드 관리자</h1>
    <span class="env" id="envLabel"></span>
    <div class="spacer"></div>
    <button class="btn small" onclick="refreshCurrent()">새로고침</button>
    <button class="btn small" onclick="logout()">로그아웃</button>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main><div class="panel" id="panel"><div class="empty">불러오는 중...</div></div></main>
</div>

<div class="toast" id="toast"></div>

<script>
// 러닝그라운드 웹 관리자 — 같은 도메인(/api)의 admin API를 x-admin-token으로 호출.
const API = '/api/admin';
let TOKEN = localStorage.getItem('rg.adminToken') || '';
let currentTab = 'overview';
// PATCH 엔드포인트는 부분 업데이트가 아니라 전체 입력을 검증하므로, 토글 시
// 마지막으로 불러온 원본 레코드를 통째로 보내기 위한 캐시.
const cache = { notices: [], market: [] };

const TABS = [
  { id: 'overview', label: '개요' },
  { id: 'live', label: '🔴 라이브' },
  { id: 'users', label: '유저' },
  { id: 'redemptions', label: '리워드 신청' },
  { id: 'inquiries', label: '문의' },
  { id: 'notices', label: '공지' },
  { id: 'market', label: '마켓' },
  { id: 'races', label: '오프라인 대회' },
];

// 라이브 탭 자동 새로고침 — 서버 부하를 최소로:
//  · 기본 30초 간격 (직접 [지금 새로고침]으로 언제든 즉시 갱신 가능)
//  · 라이브 탭을 떠나면 정지
//  · 브라우저 탭이 백그라운드면 정지 (방치된 탭이 하루 종일 폴링하지 않게),
//    다시 보이면 즉시 1회 갱신 후 재개
const LIVE_REFRESH_MS = 30000;
let liveAutoRefresh = null;
function syncLiveAutoRefresh() {
  if (currentTab === 'live' && !liveAutoRefresh) {
    liveAutoRefresh = setInterval(() => {
      if (currentTab === 'live' && !document.hidden) loadLive().catch(() => {});
    }, LIVE_REFRESH_MS);
  } else if (currentTab !== 'live' && liveAutoRefresh) {
    clearInterval(liveAutoRefresh);
    liveAutoRefresh = null;
  }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && currentTab === 'live') loadLive().catch(() => {});
});

function el(id) { return document.getElementById(id); }
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function toast(message, isError) {
  const node = el('toast');
  node.textContent = message;
  node.className = 'toast' + (isError ? ' error' : '');
  node.style.display = 'block';
  clearTimeout(node._t);
  node._t = setTimeout(() => { node.style.display = 'none'; }, 2600);
}

async function api(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'x-admin-token': TOKEN,
      ...(options.headers || {}),
    },
  });
  let body = null;
  try { body = await response.json(); } catch { /* empty body */ }
  if (!response.ok) {
    throw new Error(body?.message || `요청 실패 (${response.status})`);
  }
  return body;
}

async function doLogin(event) {
  event.preventDefault();
  TOKEN = el('tokenInput').value.trim();
  try {
    const session = await api('/session');
    localStorage.setItem('rg.adminToken', TOKEN);
    enterApp(session);
  } catch {
    el('loginError').style.display = 'block';
  }
  return false;
}

function logout() {
  localStorage.removeItem('rg.adminToken');
  location.reload();
}

function enterApp(session) {
  el('login').style.display = 'none';
  el('app').style.display = 'block';
  el('envLabel').textContent = session?.environment ? `env: ${session.environment}` : '';
  renderTabs();
  selectTab('overview');
}

function renderTabs() {
  el('tabs').innerHTML = TABS.map((tab) => (
    `<button class="tab${tab.id === currentTab ? ' active' : ''}" onclick="selectTab('${tab.id}')">${tab.label}</button>`
  )).join('');
}

function selectTab(tabId) {
  currentTab = tabId;
  renderTabs();
  refreshCurrent();
}

function refreshCurrent() {
  syncLiveAutoRefresh();
  el('panel').innerHTML = '<div class="empty">불러오는 중...</div>';
  ({ overview: loadOverview, live: loadLive, users: loadUsers, redemptions: loadRedemptions, inquiries: loadInquiries, notices: loadNotices, market: loadMarket, races: loadRaces })[currentTab]()
    .catch((error) => { el('panel').innerHTML = `<div class="empty">${esc(error.message)}</div>`; });
}

// ── 라이브 ───────────────────────────────────────────────────────────────────
const MODE_LABEL = { duel: '1대1 대결', group: '그룹 대결' };

function formatElapsed(totalSeconds) {
  const total = Math.max(0, Math.round(totalSeconds || 0));
  const minutes = Math.floor(total / 60);
  const seconds = String(total % 60).padStart(2, '0');
  return `${minutes}:${seconds}`;
}

async function loadLive() {
  const data = await api('/live');

  const sessionCards = data.sessions.map((session) => {
    const badge = `${MODE_LABEL[session.mode] || session.mode}${session.isPartyRun ? ' · 파티런' : ''}${session.isTestMatch ? ' · 테스트' : ''}`;
    const rows = session.participants.map((participant) => `
      <tr>
        <td><b>${esc(participant.name)}</b> <span class="muted">${esc(participant.tag)}</span></td>
        <td>${participant.finished
          ? `<span class="chip fulfilled">완주 ${formatElapsed(participant.finishElapsedSeconds)}</span>`
          : `<span class="chip ${participant.liveStatus === 'running' ? 'on' : 'off'}">${esc(participant.liveStatus)}</span>`}</td>
        <td style="text-align:right;"><b>${(participant.liveDistanceKm ?? 0).toFixed(2)}km</b></td>
        <td style="text-align:right;">${esc(participant.livePace)}</td>
        <td style="text-align:right;">${formatElapsed(participant.liveElapsedSeconds)}</td>
        <td class="muted">${participant.liveUpdatedAt ? esc(participant.liveUpdatedAt.slice(11, 19)) : '-'}</td>
      </tr>`).join('');
    return `
      <div class="stat" style="grid-column: 1 / -1; padding: 14px 16px;">
        <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
          <b>${esc(badge)} · ${session.distanceKm ?? '?'}km</b>
          <span class="row">
            <span class="muted">시작 ${session.slotStartAt ? esc(session.slotStartAt.slice(11, 16)) : '-'} (UTC)</span>
            <button class="btn danger small" onclick="removeLiveSession('${esc(session.id)}')">세션 강제 종료</button>
          </span>
        </div>
        <div class="table-scroll"><table>
          <tr><th>러너</th><th>상태</th><th>거리</th><th>페이스</th><th>경과</th><th>마지막 갱신</th></tr>
          ${rows}
        </table></div>
      </div>`;
  }).join('');

  const roomRows = data.rooms.map((room) => `
    <tr>
      <td><b>${esc(MODE_LABEL[room.mode] || room.mode)}</b> <span class="muted">${room.startMode === 'host' ? '방장 시작' : '예약'}</span></td>
      <td>${room.distanceKm ?? '?'}km</td>
      <td>${esc(room.hostName)}</td>
      <td style="text-align:right;">${room.participantCount}/${room.maxParticipants ?? '?'}</td>
      <td>${esc(room.inviteToken)}</td>
      <td class="muted">${room.slotStartAt ? esc(room.slotStartAt.slice(5, 16).replace('T', ' ')) : '-'}</td>
      <td><button class="btn danger small" onclick="removeLiveRoom('${esc(room.id)}')">삭제</button></td>
    </tr>`).join('');

  const liveRunRows = data.liveRuns.map((run) => `
    <tr>
      <td><b>${esc(run.name)}</b> <span class="muted">${esc(run.tag)}</span></td>
      <td><span class="chip ${run.stale ? 'off' : (run.status === 'running' ? 'on' : 'requested')}">${run.stale ? '신호 끊김' : (run.status === 'running' ? '달리는 중' : '일시정지')}</span></td>
      <td>${esc(run.locationLabel || '-')}</td>
      <td class="muted">${run.updatedAt ? esc(run.updatedAt.slice(11, 19)) : '-'}</td>
    </tr>`).join('');

  el('panel').innerHTML = `
    <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
      <div class="row" style="gap: 16px;">
        <b>진행 중 대결 ${data.counts.sessions}</b>
        <b>대기 중 파티방 ${data.counts.rooms}</b>
        <b>라이브 솔로 러너 ${data.counts.liveRuns}</b>
      </div>
      <span class="row">
        <span class="muted">30초마다 자동 갱신 · ${esc(data.generatedAt.slice(11, 19))} UTC</span>
        <button class="btn small" onclick="loadLive().catch(() => {})">지금 새로고침</button>
      </span>
    </div>
    <div class="section-title" style="margin-top:0;">진행 중 대결 세션</div>
    ${sessionCards ? `<div class="grid">${sessionCards}</div>` : '<div class="empty">지금 진행 중인 대결이 없어요.</div>'}
    <div class="section-title">대기 중인 파티방 (시작 전)</div>
    ${roomRows ? `<div class="table-scroll"><table>
      <tr><th>모드</th><th>거리</th><th>방장</th><th>인원</th><th>초대 코드</th><th>시작 예정</th><th></th></tr>${roomRows}
    </table></div>` : '<div class="empty">대기 중인 방이 없어요.</div>'}
    <div class="section-title">라이브 공유 중인 솔로 러너</div>
    ${liveRunRows ? `<div class="table-scroll"><table>
      <tr><th>러너</th><th>상태</th><th>위치</th><th>마지막 갱신</th></tr>${liveRunRows}
    </table></div>` : '<div class="empty">라이브 공유 중인 러너가 없어요.</div>'}`;
}

// ── 개요 ─────────────────────────────────────────────────────────────────────
async function loadOverview() {
  const data = await api('/overview');
  const items = [
    ['유저', data.counts.users], ['러닝 기록', data.counts.runs], ['세션(로그인)', data.counts.sessions],
    ['리워드 신청', data.counts.rewardRedemptions], ['마켓 상품(활성)', `${data.counts.activeMarketItems}/${data.counts.marketItems}`],
    ['공지(활성)', `${data.counts.activeNotices}/${data.counts.notices}`],
    ['대회(활성)', `${data.counts.activeOfflineRaceEvents}/${data.counts.offlineRaceEvents}`],
  ];
  el('panel').innerHTML = `
    <div class="grid">${items.map(([label, value]) => `
      <div class="stat"><div class="label">${label}</div><div class="value">${esc(value)}</div></div>`).join('')}
    </div>
    <p class="muted" style="margin-top:14px;">${esc(data.environment)} · ${esc(data.publicBaseUrl || '')}</p>`;
}

async function removeLiveSession(sessionId) {
  if (!confirm('이 대결 세션을 강제 종료할까요?\n참가자 앱은 "대결이 종료됐어요"로 정리되고, 연결된 파티방도 함께 삭제돼요.')) return;
  try {
    await api(`/live/sessions/${encodeURIComponent(sessionId)}`, { method: 'DELETE' });
    toast('세션을 강제 종료했어요');
    refreshCurrent();
  } catch (error) { toast(error.message, true); }
}

async function removeLiveRoom(roomId) {
  if (!confirm('이 파티방을 삭제할까요? 참가자들은 방에서 자동으로 나가져요.')) return;
  try {
    await api(`/live/rooms/${encodeURIComponent(roomId)}`, { method: 'DELETE' });
    toast('방을 삭제했어요');
    refreshCurrent();
  } catch (error) { toast(error.message, true); }
}

// ── 유저 ─────────────────────────────────────────────────────────────────────
async function loadUsers() {
  const data = await api('/users');
  const rows = data.users.map((user) => `
    <tr>
      <td><b>${esc(user.name)}</b><br><span class="muted">@${esc(user.username)} · ${esc(user.publicTag)}</span></td>
      <td>${esc([user.provinceName, user.cityName, user.districtName].filter(Boolean).join(' '))}</td>
      <td>${esc(user.phone || '-')}</td>
      <td style="text-align:right;">${user.totalRuns}회 / ${user.lifetimeDistanceKm}km</td>
      <td style="text-align:right;">주간 ${user.currentWeekDistanceKm}km · ${user.currentWeekPoints}P</td>
      <td>${user.createdAt ? esc(user.createdAt.slice(0, 10)) : '-'}</td>
      <td><button class="btn danger small" onclick="removeUser('${esc(user.id)}', '${esc(user.username)}')">삭제</button></td>
    </tr>`).join('');
  el('panel').innerHTML = `
    <p class="muted" style="margin-bottom:10px;">총 ${data.users.length}명 · ⚠️ 심사용 계정 <b>reviewer01</b>은 심사 중 삭제 금지</p>
    <div class="table-scroll"><table>
      <tr><th>이름/아이디</th><th>지역</th><th>전화</th><th>누적</th><th>이번 주</th><th>가입일</th><th></th></tr>
      ${rows || '<tr><td colspan="7" class="empty">유저가 없어요.</td></tr>'}
    </table></div>`;
}

async function removeUser(userId, username) {
  if (username === 'reviewer01' && !confirm('⚠️ reviewer01은 앱스토어 심사용 계정입니다. 심사 중이면 절대 지우면 안 돼요. 정말 삭제할까요?')) return;
  if (!confirm(`유저 @${username}과 모든 데이터(기록/친구/알림)를 삭제할까요? 되돌릴 수 없어요.`)) return;
  try {
    await api(`/users/${encodeURIComponent(userId)}`, { method: 'DELETE' });
    toast(`@${username} 삭제 완료`);
    refreshCurrent();
  } catch (error) { toast(error.message, true); }
}

// ── 리워드 신청 ───────────────────────────────────────────────────────────────
async function loadRedemptions() {
  const data = await api('/reward-redemptions');
  const rows = data.items.map((item) => `
    <tr>
      <td><b>${esc(item.itemTitle)}</b><br><span class="muted">${item.costPoints}P</span></td>
      <td>${esc(item.userName)}<br><span class="muted">${esc(item.userTag)}</span></td>
      <td><span class="chip ${esc(item.status)}">${{ requested: '신청됨', fulfilled: '지급 완료', cancelled: '취소됨' }[item.status] || esc(item.status)}</span>
        ${item.adminNote ? `<br><span class="muted">${esc(item.adminNote)}</span>` : ''}</td>
      <td>${esc((item.claimedAt || '').slice(0, 16).replace('T', ' '))}</td>
      <td class="row">
        ${item.status === 'requested' ? `
          <button class="btn good small" onclick="setRedemption('${esc(item.id)}', 'fulfilled')">지급 완료</button>
          <button class="btn danger small" onclick="setRedemption('${esc(item.id)}', 'cancelled')">취소</button>` : `
          <button class="btn small" onclick="setRedemption('${esc(item.id)}', 'requested')">신청 상태로 되돌리기</button>`}
      </td>
    </tr>`).join('');
  el('panel').innerHTML = `
    <div class="table-scroll"><table>

// ── 공지 ─────────────────────────────────────────────────────────────────────

async function createNotice(event) {
  event.preventDefault();
  try {
    await api('/notices', { method: 'POST', body: JSON.stringify({
      title: el('nTitle').value.trim(),
      message: el('nMessage').value.trim(),
      priority: Number(el('nPriority').value) || 1,
      isActive: el('nActive').value === 'true',
    }) });
    toast('공지를 등록했어요');
    refreshCurrent();
  } catch (error) { toast(error.message, true); }
  return false;
}

async function toggleNotice(id, isActive) {
  const notice = cache.notices.find((entry) => entry.id === id);
  if (!notice) return;
  try {
    // PATCH validates the FULL input — resend every field with only isActive flipped.
    await api(`/notices/${encodeURIComponent(id)}`, { method: 'PATCH', body: JSON.stringify({
      title: notice.title,
      message: notice.message,
      priority: notice.priority,
      isActive: !isActive,
    }) });
    toast(isActive ? '공지를 숨겼어요' : '공지를 노출했어요');

async function removeNotice(id) {

  try {
    await api(`/notices/${encodeURIComponent(id)}`, { method: 'DELETE' });
    toast('공지를 삭제했어요');
    refreshCurrent();
  } catch (error) { toast(error.message, true); }

// ── 문의 ─────────────────────────────────────────────────────────────────────
function formatInquiryAt(value) {
  // 서버는 ISO(UTC) — 한국 시간으로 읽기 좋게.
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '-';
  return new Intl.DateTimeFormat('ko-KR', {
    timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
  }).format(date);
}

async function loadInquiries() {
  const data = await api('/inquiries');

  const cards = data.inquiries.map((inquiry) => {
    const replies = inquiry.replies.map((reply) => `
      <div style="margin-top:8px; padding:10px 12px; border-radius:10px; background:rgba(109,94,247,0.10);">
        <div class="muted" style="font-size:12px;">답변 · ${esc(formatInquiryAt(reply.createdAt))}</div>
        <div style="white-space:pre-wrap;">${esc(reply.body)}</div>
      </div>`).join('');

    return `
      <div style="border:1px solid #E4E7EC; border-radius:12px; padding:14px; margin-bottom:12px;">
        <div class="row" style="justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>
            <b>${esc(inquiry.title)}</b>
            <div class="muted" style="font-size:12px;">
              ${esc(inquiry.userName)} ${esc(inquiry.userTag)} · ${esc(formatInquiryAt(inquiry.createdAt))}
            </div>
          </div>
          <span class="chip ${inquiry.status === 'pending' ? 'off' : 'on'}">${inquiry.status === 'pending' ? '답변 대기' : '답변 완료'}</span>
        </div>
        <div style="margin-top:10px; white-space:pre-wrap;">${esc(inquiry.body)}</div>
        ${replies}
        <form class="inquiry-reply-form" data-inquiry-id="${esc(inquiry.id)}" onsubmit="return replyInquiry(event)" style="margin-top:12px;">
          <textarea name="replyBody" rows="2" maxlength="1000" placeholder="답변을 입력하면 유저 앱 알림으로 전달돼요" required style="width:100%;"></textarea>
          <button class="btn primary small" type="submit" style="margin-top:6px;">답변 보내기</button>
        </form>
      </div>`;
  }).join('');

  el('panel').innerHTML = `
    <div class="section-title" style="margin-top:0;">문의 ${data.pendingCount > 0 ? `<span class="chip off">답변 대기 ${data.pendingCount}건</span>` : ''}</div>
    ${cards || '<div class="empty">문의가 없어요.</div>'}`;
}

async function replyInquiry(event) {
  event.preventDefault();
  // id는 data 속성으로 읽는다 — 문자열 이스케이프 이중 디코딩 컨텍스트(onsubmit 안의
  // JS 리터럴)에 사용자 입력을 넣지 않기 위함.
  const form = event.target;
  const inquiryId = form.dataset.inquiryId;
  const field = form.elements.replyBody;
  const submitButton = form.querySelector('button[type="submit"]');

  // 더블클릭 방지 — 두 번 보내면 답변도 알림도 두 번 간다.
  if (form.dataset.sending === '1') return false;
  form.dataset.sending = '1';
  if (submitButton) submitButton.disabled = true;

  try {
    await api(`/inquiries/${encodeURIComponent(inquiryId)}/reply`, {
      method: 'POST',
      body: JSON.stringify({ body: field.value.trim() }),
    });
    toast('답변을 보냈어요');
    refreshCurrent();
  } catch (error) {
    toast(error.message, true);
    form.dataset.sending = '';
    if (submitButton) submitButton.disabled = false;
  }
  return false;
}

    </form>
    <div class="section-title">상품 목록</div>
    <div class="table-scroll"><table>
      <tr><th>상품</th><th>포인트</th><th>재고</th><th>신청</th><th>상태</th><th></th></tr>
