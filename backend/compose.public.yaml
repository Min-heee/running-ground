services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_APP_ENV: ${BACKEND_APP_ENV}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8081}
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-*}
      BACKEND_PUBLIC_BASE_URL: ${BACKEND_PUBLIC_BASE_URL}
      BACKEND_STORE_DRIVER: ${BACKEND_STORE_DRIVER:-json}
      BACKEND_STORE_FILE: ${BACKEND_STORE_FILE:-/app/data/store.json}
      BACKEND_STORE_BACKUP_DIRECTORY: ${BACKEND_STORE_BACKUP_DIRECTORY:-/app/data/backups}
      BACKEND_STORE_BACKUP_ON_SAVE: ${BACKEND_STORE_BACKUP_ON_SAVE:-true}
      BACKEND_STORE_BACKUP_RETENTION: ${BACKEND_STORE_BACKUP_RETENTION:-10}
      BACKEND_POSTGRES_DATABASE_URL: ${BACKEND_POSTGRES_DATABASE_URL:-}
      BACKEND_POSTGRES_SSL: ${BACKEND_POSTGRES_SSL:-false}
      BACKEND_POSTGRES_POOL_MAX: ${BACKEND_POSTGRES_POOL_MAX:-10}
      BACKEND_POSTGRES_IDLE_TIMEOUT_MS: ${BACKEND_POSTGRES_IDLE_TIMEOUT_MS:-30000}
      BACKEND_POSTGRES_CONNECTION_TIMEOUT_MS: ${BACKEND_POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      BACKEND_POSTGRES_APPLICATION_NAME: ${BACKEND_POSTGRES_APPLICATION_NAME:-}
      BACKEND_POSTGRES_ENABLE_SESSION_READS: ${BACKEND_POSTGRES_ENABLE_SESSION_READS:-false}
      BACKEND_POSTGRES_ENABLE_RUN_READS: ${BACKEND_POSTGRES_ENABLE_RUN_READS:-false}
      BACKEND_POSTGRES_ENABLE_FRIEND_READS: ${BACKEND_POSTGRES_ENABLE_FRIEND_READS:-false}
      BACKEND_POSTGRES_ENABLE_LEAGUE_READS: ${BACKEND_POSTGRES_ENABLE_LEAGUE_READS:-false}
      BACKEND_SESSION_TTL_HOURS: ${BACKEND_SESSION_TTL_HOURS:-168}
      BACKEND_MAX_BODY_SIZE_KB: ${BACKEND_MAX_BODY_SIZE_KB:-256}
      BACKEND_REQUEST_TIMEOUT_MS: ${BACKEND_REQUEST_TIMEOUT_MS:-30000}
      BACKEND_HEADERS_TIMEOUT_MS: ${BACKEND_HEADERS_TIMEOUT_MS:-10000}
      BACKEND_KEEP_ALIVE_TIMEOUT_MS: ${BACKEND_KEEP_ALIVE_TIMEOUT_MS:-5000}
      BACKEND_MAX_REQUESTS_PER_SOCKET: ${BACKEND_MAX_REQUESTS_PER_SOCKET:-1000}
      BACKEND_SHUTDOWN_TIMEOUT_MS: ${BACKEND_SHUTDOWN_TIMEOUT_MS:-10000}
      BACKEND_ADMIN_TOKEN: ${BACKEND_ADMIN_TOKEN:-}
      BACKEND_ENABLE_ADMIN_STATUS: ${BACKEND_ENABLE_ADMIN_STATUS:-true}
      BACKEND_ENABLE_RESET_ENDPOINT: ${BACKEND_ENABLE_RESET_ENDPOINT:-false}
      BACKEND_MATCH_PACE_TOLERANCE_SECONDS: ${BACKEND_MATCH_PACE_TOLERANCE_SECONDS:-15}
      BACKEND_GOOGLE_CLIENT_ID: ${BACKEND_GOOGLE_CLIENT_ID:-}
      BACKEND_GOOGLE_CLIENT_SECRET: ${BACKEND_GOOGLE_CLIENT_SECRET:-}
      BACKEND_KAKAO_REST_API_KEY: ${BACKEND_KAKAO_REST_API_KEY:-}
      BACKEND_KAKAO_CLIENT_SECRET: ${BACKEND_KAKAO_CLIENT_SECRET:-}
      BACKEND_NAVER_CLIENT_ID: ${BACKEND_NAVER_CLIENT_ID:-}
      BACKEND_NAVER_CLIENT_SECRET: ${BACKEND_NAVER_CLIENT_SECRET:-}
      BACKEND_PHONE_VERIFICATION_PROVIDER: ${BACKEND_PHONE_VERIFICATION_PROVIDER:-}
      BACKEND_PHONE_VERIFICATION_CODE_TTL_MINUTES: ${BACKEND_PHONE_VERIFICATION_CODE_TTL_MINUTES:-}
      BACKEND_PHONE_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${BACKEND_PHONE_VERIFICATION_RESEND_COOLDOWN_SECONDS:-}
      BACKEND_PHONE_VERIFICATION_MAX_ATTEMPTS: ${BACKEND_PHONE_VERIFICATION_MAX_ATTEMPTS:-}
      BACKEND_PHONE_VERIFICATION_VERIFIED_TTL_MINUTES: ${BACKEND_PHONE_VERIFICATION_VERIFIED_TTL_MINUTES:-}
      BACKEND_PHONE_VERIFICATION_EXPOSE_TEST_CODE: ${BACKEND_PHONE_VERIFICATION_EXPOSE_TEST_CODE:-}
      BACKEND_SOLAPI_API_KEY: ${BACKEND_SOLAPI_API_KEY:-}
      BACKEND_SOLAPI_API_SECRET: ${BACKEND_SOLAPI_API_SECRET:-}
      BACKEND_SOLAPI_SENDER: ${BACKEND_SOLAPI_SENDER:-}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  backend_data:
  caddy_data:
  caddy_config:
