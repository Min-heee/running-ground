services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-runnigapp}-api
    init: true
    environment:
      BACKEND_APP_ENV: ${BACKEND_APP_ENV}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8081}
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-*}
      BACKEND_PUBLIC_BASE_URL: ${BACKEND_PUBLIC_BASE_URL}
      BACKEND_STORE_FILE: ${BACKEND_STORE_FILE:-/app/data/store.json}
      BACKEND_STORE_BACKUP_DIRECTORY: ${BACKEND_STORE_BACKUP_DIRECTORY:-/app/data/backups}
      BACKEND_STORE_BACKUP_ON_SAVE: ${BACKEND_STORE_BACKUP_ON_SAVE:-true}
      BACKEND_STORE_BACKUP_RETENTION: ${BACKEND_STORE_BACKUP_RETENTION:-10}
      BACKEND_SESSION_TTL_HOURS: ${BACKEND_SESSION_TTL_HOURS:-168}
      BACKEND_MAX_BODY_SIZE_KB: ${BACKEND_MAX_BODY_SIZE_KB:-256}
      BACKEND_ADMIN_TOKEN: ${BACKEND_ADMIN_TOKEN:-}
      BACKEND_ENABLE_ADMIN_STATUS: ${BACKEND_ENABLE_ADMIN_STATUS:-true}
      BACKEND_ENABLE_RESET_ENDPOINT: ${BACKEND_ENABLE_RESET_ENDPOINT:-false}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-runnigapp}-caddy
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  backend_data:
  caddy_data:
  caddy_config:
